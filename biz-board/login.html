<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1f24" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Sans+KR:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>비즈보드 로그인</title>
  </head>
  <body>
    <div class="login-shell">
      <div class="login-card" id="card">
        <h1 id="title">로그인 준비</h1>
        <p id="desc">사전 정의된 ID/PW로 로그인 절차를 수행합니다.</p>
        <div class="spinner" id="spinner" aria-hidden="true"></div>
        <div class="assist-box" id="assist" hidden></div>
        <div class="hero-actions" style="justify-content: center; margin-top: 16px">
          <a class="btn" href="./index.html">보드로 돌아가기</a>
        </div>
      </div>
    </div>
    <form id="autoForm" method="post" style="display: none"></form>
    <script src="config.js"></script>
    <script src="login.js"></script>
  </body>
</html>
