<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1f24" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="비즈보드" />
    <meta
      name="description"
      content="휴대폰 홈 아이콘으로 여는 비즈니스 바로가기·자동 로그인 보드"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>비즈보드</title>
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <h1 class="brand">비즈보드</h1>
        <p>홈 화면 아이콘 한 번으로 20개 이상 바로가기 · 사전 ID/PW 로그인</p>
        <div class="hero-actions">
          <button type="button" class="btn btn-primary" id="btnInstall">
            홈 화면에 추가
          </button>
          <button type="button" class="btn" id="btnSettings">ID/PW 설정</button>
          <button type="button" class="btn btn-mint" id="btnExport">설정 내보내기</button>
        </div>
        <div class="install-banner" id="installHelp">
          iPhone: Safari 공유 → <b>홈 화면에 추가</b><br />
          Android: Chrome 메뉴 → <b>앱 설치</b> / 홈 화면에 추가
        </div>
      </header>

      <div class="meta">
        <span id="countLabel">바로가기 0</span>
        <span id="versionLabel">v1.0.0</span>
      </div>

      <div class="grid" id="grid" aria-label="비즈보드 바로가기"></div>

      <section class="panel" id="settingsPanel" aria-live="polite">
        <h2>로그인 정보</h2>
        <p class="hint">
          기기(브라우저)에만 저장됩니다. 서버로 전송하지 않습니다. 각 항목의
          ID/PW·로그인 방식·필드명을 맞춘 뒤 저장하세요.
        </p>
        <div class="cred-list" id="credList"></div>
        <div class="hero-actions" style="margin-top: 14px">
          <button type="button" class="btn btn-primary" id="btnSave">저장</button>
          <button type="button" class="btn" id="btnCloseSettings">닫기</button>
          <button type="button" class="btn" id="btnReset">기본값 복원</button>
        </div>
      </section>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
